<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias - Nexora Apps</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#3d5a80;--primary-light:#98c1d9;--accent:#ee6c4d;--dark:#293241;--light:#e0fbfc;--bg:#0b0f1a;--bg-card:#161a2a;--text:#c8ccd8;--text-light:#7a8090;--border:rgba(152,193,217,0.08);--glass:rgba(22,26,42,0.75);--gradient-1:linear-gradient(135deg,#3d5a80,#98c1d9);--gradient-2:linear-gradient(135deg,#ee6c4d,#f5a082);--font-display:'Plus Jakarta Sans','Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif;}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.bg-glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(61,90,128,0.12),transparent),radial-gradient(ellipse 40% 30% at 80% 60%,rgba(238,108,77,0.06),transparent)}
.card{position:relative;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:24px;padding:60px 48px;text-align:center;max-width:480px;width:90%;animation:fadeUp .8s cubic-bezier(.22,1,.36,1)}
.icon{width:72px;height:72px;border-radius:50%;background:var(--gradient-2);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:2rem;color:#fff;animation:scaleIn .6s cubic-bezier(.34,1.56,.64,1) .2s both}
h1{font-family:var(--font-display);font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700;margin-bottom:12px;background:var(--gradient-1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
p{color:var(--text-light);font-size:1rem;line-height:1.7;margin-bottom:32px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:12px;font-weight:600;font-size:.9rem;border:none;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);font-family:var(--font-body);text-decoration:none}
.btn-primary{background:var(--gradient-1);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(61,90,128,.35)}
.btn-primary i{transition:transform .3s}
.btn-primary:hover i{transform:translateX(-4px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="card">
  <div class="icon"><i class="bi bi-check-lg"></i></div>
  <h1>Gracias por contactarnos</h1>
  <p>Hemos recibido tu mensaje correctamente. Nuestro equipo te responder&aacute; a la brevedad.</p>
  <a href="https://www.nexoraapps.com.ar" class="btn btn-primary"><i class="bi bi-arrow-left"></i> Volver al inicio</a>
</div>
</body>
</html>
